name: quality-gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gates:
    name: quality-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          package-manager-cache: false

      - name: Check patch hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "origin/main...HEAD"

      - name: Parse Scriptable JavaScript sources
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
            count=$((count + 1))
          done < <(find src -type f -name '*.js' -print0)
          test "$count" -gt 0
          echo "Parsed $count JavaScript source files."

      - name: Verify governance and security artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s GLOSSARY.md
          test -s SECURITY.md
          test -s docs/governance/operational-baseline.md
          test -s docs/governance/security-baseline.md
          test -s docs/governance/evidence-register.md
          test -s docs/governance/compatibility-matrix.md
          test -s docs/governance/ci-baseline.md
          test -s docs/governance/device-test-procedure.md
          test -s .github/dependabot.yml
          test -s src/compatibility_probe.js
          test -s src/async_runtime_probe.js
          test -s src/webview_context_probe.js
          test -s src/widget_context_probe.js

      - name: Keep device probes isolated
        shell: bash
        run: |
          set -euo pipefail
          if grep -En 'Keychain\.(get|set|contains|remove)|FileManager\.(local|iCloud|documents)|Pasteboard\.(copy|paste)|new[[:space:]]+Request|new[[:space:]]+Notification|Location\.(current|reverseGeocode)' \
            src/compatibility_probe.js src/async_runtime_probe.js src/webview_context_probe.js src/widget_context_probe.js; then
            echo "Device probes must not access private host data or services." >&2
            exit 1
          fi
