name: quality-gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gates:
    name: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          package-manager-cache: false

      - name: Parse Scriptable JavaScript sources
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
            count=$((count + 1))
          done < <(find src -type f -name '*.js' -print0)
          test "$count" -gt 0
          echo "Parsed $count JavaScript source files."

      - name: Verify governance artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s GLOSSARY.md
          test -s docs/governance/operational-baseline.md
          test -s docs/governance/evidence-register.md
          test -s docs/governance/compatibility-matrix.md

      - name: Keep device probes isolated
        shell: bash
        run: |
          set -euo pipefail
          if grep -En 'Keychain\.|FileManager\.|Pasteboard\.|new[[:space:]]+Request|new[[:space:]]+Notification|Location\.' \
            src/compatibility_probe.js src/async_runtime_probe.js; then
            echo "Device probes must not access private host data or services." >&2
            exit 1
          fi
